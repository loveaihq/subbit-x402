# The same checks on Linux, macOS and Windows, on the oldest Node the package supports and a
# current one, and the validator's Aiken tests once. Nothing here touches a chain or needs a
# secret: every test in test/ is chain-free, and the preprod runs in spike/ are not run here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      # The repository's files are LF; a Windows checkout would otherwise turn them into CRLF and
      # test something no one ships.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `prepare` builds dist/ as part of the install, as it does for anyone installing from git.
      - run: npm ci
      # bash on every runner, so `pipefail` keeps npm test's exit status through the `tee` that
      # keeps the output for the step after it.
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      # A job's log needs a signed-in viewer; its annotations do not. So a failure names itself.
      - name: name the failures
        if: failure()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}'; }
          notok=$(grep -A 12 -E "^\s*not ok" test-output.txt | head -120 | enc || true)
          [ -n "$notok" ] && echo "::error title=npm test, what did not pass::${notok}"
          echo "::error title=npm test, last 25 lines::$(tail -n 25 test-output.txt | enc)"
      - run: npm run typecheck

  # Subbit's validator and our tests of it (vendor/subbit/aiken/lib/mark/). The output is the same
  # on every platform, so once is enough. 1.1.24 rather than the 1.1.23 aiken.toml names: 1.1.23
  # prints no errors when stdout is not a terminal (aiken-lang/aiken#1438), which a CI log never is.
  validator:
    name: aiken check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.24
      - run: aiken check vendor/subbit/aiken
      # The sponsored variant (variant/sponsored/) and its tests.
      - run: aiken check variant/sponsored/aiken
      # test/variant.test.ts runs the compiled validators on the transactions the builders make
      # (`aiken tx simulate`). Those tests skip where aiken is not on PATH, as in the job above.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test --import tsx test/variant.test.ts
